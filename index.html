<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد السيرة الذاتية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>مولّد السيرة الذاتية - CV Generator</header>
  <form id="cvForm">
    <label for="name">الاسم الكامل:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" name="email" required>

    <label for="education">المؤهل العلمي:</label>
    <textarea id="education" name="education" rows="3" required></textarea>

    <label for="skills">المهارات:</label>
    <textarea id="skills" name="skills" rows="3" required></textarea>

    <label for="experience">الخبرات:</label>
    <textarea id="experience" name="experience" rows="4"></textarea>

    <button type="button" onclick="generateCV()">تحميل السيرة الذاتية</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
